services:
  cowrie-stats:
    build: .
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      COWRIE_LOG: /cowrie/var/log/cowrie/cowrie.json
      COWRIE_DB: /data/stats.sqlite3
      COWRIE_API_TOKEN: ${COWRIE_API_TOKEN:?set token in .env}
      COWRIE_TLS_CERT: /certs/server.crt
      COWRIE_TLS_KEY: /certs/server.key
    ports:
      - "8765:8765"
    volumes:
      - cowrie_var:/cowrie/var:ro
      - stats_data:/data
      - ./certs:/certs:ro
volumes:
  cowrie_var:
    external: true
    name: ${COWRIE_VAR_VOLUME:?set Cowrie var volume}
  stats_data:
