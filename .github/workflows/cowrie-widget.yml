name: Cowrie widget tests
on:
  push:
    branches: [feature/cowrie-widget]
  pull_request:
    paths:
      - "src/widgets/cowrie/**"
      - "integrations/cowrie-stats/**"
      - "src/widgets/components.js"
      - "src/widgets/widgets.js"
      - ".github/workflows/cowrie-widget.yml"
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile integrations/cowrie-stats/server.py
      - run: cd integrations/cowrie-stats && python3 -m unittest discover -s tests -v
  widget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run src/widgets/cowrie
